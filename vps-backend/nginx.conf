# Configuração Nginx alternativa para a VPS
server {
    listen 80;
    server_name api.beckbarbearia.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.beckbarbearia.com.br;

    ssl_certificate /etc/letsencrypt/live/api.beckbarbearia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.beckbarbearia.com.br/privkey.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
