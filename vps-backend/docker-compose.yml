services:
  beck-backend:
    build:
      context: ..
      dockerfile: vps-backend/Dockerfile
    container_name: beck-barbearia-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - beck-net

  beck-caddy:
    image: caddy:2-alpine
    container_name: beck-barbearia-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - beck-backend
    networks:
      - beck-net

networks:
  beck-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
